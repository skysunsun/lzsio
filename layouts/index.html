{{ define "main" }}
{{ $pages := where .Site.RegularPages "Params.excludeFromHome" "!=" true }}

<section class="list-block">
  <div class="post-list">
    {{ range $i, $p := first 24 (sort $pages "Date" "desc") }}
      {{ partial "post-card.html" (dict "p" $p "i" $i) }}
    {{ end }}
    {{ if eq (len $pages) 0 }}
      <p class="row-summary" style="padding:28px 0;">还没有文章。第一篇还在路上。</p>
    {{ end }}
  </div>
</section>
{{ end }}
