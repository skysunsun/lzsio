{{ $ogimg := printf "%simg/og-cover.png" .Site.BaseURL }}
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title }},
  "url": {{ .Site.BaseURL }},
  "description": {{ .Site.Params.description }},
  "inLanguage": "zh-CN"
}
</script>
{{ else if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title }},
  "description": {{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }},
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05-07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }}",
  "inLanguage": "zh-CN",
  "image": {{ $ogimg }},
  "author": {
    "@type": "Organization",
    "name": {{ .Site.Title }},
    "url": {{ .Site.BaseURL }}
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ .Site.Title }},
    "url": {{ .Site.BaseURL }},
    "logo": { "@type": "ImageObject", "url": {{ $ogimg }} }
  },
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ .Permalink }} }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "首页", "item": {{ .Site.BaseURL }} },
    { "@type": "ListItem", "position": 2, "name": {{ .Title }}, "item": {{ .Permalink }} }
  ]
}
</script>
{{ end }}
